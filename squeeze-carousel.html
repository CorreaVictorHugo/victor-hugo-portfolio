<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squeeze Carousel — Teste</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #121212; color: #f5f5f5; padding: 40px; }

    h1 { font-size: 28px; margin-bottom: 8px; }
    p.hint { color: #888; margin-bottom: 32px; }

    .sq-carousel { display: flex; width: 100%; flex-direction: column; max-width: 1200px; margin: 0 auto; container-type: inline-size;
      --sq-h: 320px; --sq-gap: 16px; --sq-slat-gap: 8px; --sq-radius: 6px; --sq-ms: 1000ms;
      --sq-ease: cubic-bezier(0.16, 1, 0.3, 1); --sq-fill: #d61c59; --sq-on-fill: #fff;
      --sq-hero: calc(var(--sq-h) * 16 / 9);
      --sq-room: calc(100cqi - var(--sq-hero) - 3 * var(--sq-slat-gap) - 3 * var(--sq-gap) - 3 * 8px);
    }

    .sq-controls { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 16px; }
    .sq-arrow { display: grid; width: 36px; height: 36px; place-items: center; border: none; border-radius: 6px; background: var(--sq-fill); color: var(--sq-on-fill); cursor: pointer; transition: opacity 0.2s; }
    .sq-arrow:hover { opacity: 0.85; }

    .sq-viewport { width: 100%; overflow: hidden; height: var(--sq-h); }
    .sq-strip { display: flex; height: 100%; width: max-content; }

    .sq-panel {
      position: relative; isolation: isolate; height: 100%; flex-shrink: 0;
      overflow: hidden; background: #1e1e1e; border: none; padding: 0; cursor: pointer; outline: none;
      transition-property: width, margin-left;
      transition-duration: var(--sq-ms);
      transition-timing-function: var(--sq-ease);
    }
    .sq-panel:focus-visible { outline: 2px solid var(--sq-fill); outline-offset: 2px; }

    .sq-img {
      position: absolute; inset-block: 0; left: 50%; height: 100%; max-width: none;
      transform: translateX(-50%); object-fit: cover;
    }

    .sq-overlay {
      position: absolute; inset-inline: 0; bottom: 0; display: flex; align-items: flex-end;
      padding: 16px; padding-top: 64px; pointer-events: none;
      background: linear-gradient(to top, rgb(0 0 0 / 0.55), transparent);
      transition: opacity var(--sq-ms) var(--sq-ease);
      color: #fff; font-size: 14px; font-weight: 500;
    }

    .sq-info { margin-top: 24px; display: grid; }
    .sq-info-slide {
      grid-column: 1; grid-row: 1; display: flex; flex-direction: column; gap: 16px;
      transition: opacity var(--sq-ms) var(--sq-ease), visibility var(--sq-ms);
    }
    @media (min-width: 768px) { .sq-info-slide { flex-direction: row; align-items: flex-start; justify-content: space-between; gap: 40px; } }

    .sq-text { max-width: 46rem; font-size: 16px; line-height: 1.6; color: #f5f5f5; }
    .sq-desc { color: #888; }

    .sq-action {
      display: inline-flex; flex-shrink: 0; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 6px; background: var(--sq-fill); color: var(--sq-on-fill);
      font-size: 14px; font-weight: 500; text-decoration: none; transition: opacity 0.2s; white-space: nowrap;
    }
    .sq-action:hover { opacity: 0.85; }
  </style>
</head>
<body>

<h1>Squeeze Carousel</h1>
<p class="hint">Clique nos painéis, use as setas, ou passe o mouse para ver o efeito de squeeze. Setas ← → no teclado também funcionam.</p>

<div class="sq-carousel" id="carousel">
  <div class="sq-controls">
    <button class="sq-arrow" id="prev" aria-label="Anterior">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M9.6 2.6 5.1 7.1h9.1v1.8H5.1l4.5 4.5-1.2 1.2-6-6L1.8 8l.6-.6 6-6 1.2 1.2Z"/></svg>
    </button>
    <button class="sq-arrow" id="next" aria-label="Próximo">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M6.4 2.6l4.5 4.5H1.8v1.8h9.1l-4.5 4.5 1.2 1.2 6-6 .6-.6-.6-.6-6-6-1.2 1.2Z"/></svg>
    </button>
  </div>
  <div class="sq-viewport">
    <div class="sq-strip" id="strip" role="tablist"></div>
  </div>
  <div class="sq-info" id="info"></div>
</div>

<script>
const slides = [
  { title: "Landing pages que convertem.", description: "Páginas focadas na sua oferta e no próximo passo do visitante.", image: "https://picsum.photos/seed/landing/800/450", overlay: "Landing Page", action: "Ver exemplo", href: "#" },
  { title: "Sites institucionais com presença.", description: "Uma presença digital que apresenta sua empresa com clareza.", image: "https://picsum.photos/seed/institucional/800/450", overlay: "Institucional", action: "Ver exemplo", href: "#" },
  { title: "Redesign que transforma.", description: "Uma nova direção para o visual e a experiência do seu site.", image: "https://picsum.photos/seed/redesign/800/450", overlay: "Redesign", action: "Ver exemplo", href: "#" },
  { title: "Aplicações web funcionais.", description: "Interfaces pensadas para as necessidades do seu negócio.", image: "https://picsum.photos/seed/app/800/450", overlay: "App Web", action: "Ver exemplo", href: "#" },
  { title: "E-commerce que vende.", description: "Lojas online com foco na experiência de compra.", image: "https://picsum.photos/seed/ecommerce/800/450", overlay: "E-commerce", action: "Ver exemplo", href: "#" },
  { title: "Portfólios criativos.", description: "Mostre seu trabalho com um site que impressiona.", image: "https://picsum.photos/seed/portfolio/800/450", overlay: "Portfólio", action: "Ver exemplo", href: "#" },
];

const SHARES = [-0.06, 0.61, 0.3, 0.15];
const STRETCHED = [0, 0.71, 0.4, 0.25];
const SQUEEZED = [-0.12, 0.59, 0.28, 0.13];
const slats = Math.max(1, Math.min(3, slides.length - 4));
const visible = 4 + slats;
const SLAT = '8px';

let cards = [];
let seed = 0;
let column = 0;
let slid = 0;
let still = false;
let hover = -1;
let forward = true;
let openIndex = 0;

function wrap(i) { return ((i % slides.length) + slides.length) % slides.length; }

function initCards() {
  cards = Array.from({ length: visible }, (_, p) => ({ key: seed++, slide: wrap(p) }));
}
initCards();

function shareOf(col) {
  if (hover < 0 || col < 0 || col > 3) return SHARES[col];
  return hover === col ? STRETCHED[col] : SQUEEZED[col];
}

function widthOf(col) {
  if (col < 0 || col > 3) return SLAT;
  if (col === 0) return `calc(var(--sq-hero) + var(--sq-room) * ${shareOf(0)})`;
  return `calc(var(--sq-room) * ${shareOf(col)})`;
}

function render() {
  const strip = document.getElementById('strip');
  const info = document.getElementById('info');

  strip.innerHTML = cards.map((card, place) => {
    const col = place + column;
    const slide = slides[card.slide];
    const front = col === 0;
    const ml = place === 0 ? '0' : col < 4 ? 'var(--sq-gap)' : 'var(--sq-slat-gap)';
    return `
      <button class="sq-panel" data-col="${col}" data-slide="${card.slide}"
        aria-selected="${front}" tabindex="${front ? 0 : -1}"
        style="width:${widthOf(col)}; margin-left:${ml}; border-radius:min(var(--sq-radius), calc(${widthOf(col)} / 2))">
        <img class="sq-img" src="${slide.image}" alt="" draggable="false" style="width:var(--sq-hero); min-width:100%">
        <span class="sq-overlay" style="opacity:${front ? 1 : 0}">${slide.overlay || ''}</span>
      </button>`;
  }).join('');

  strip.style.transform = `translateX(calc(${slid} * (${SLAT} + var(--sq-gap))))`;
  strip.style.transition = still ? 'none' : `transform var(--sq-ms) var(--sq-ease)`;

  openIndex = cards[-column]?.slide ?? 0;

  info.innerHTML = slides.map((slide, i) => {
    const shown = i === openIndex;
    return `
      <div class="sq-info-slide" aria-hidden="${!shown}"
        style="opacity:${shown ? 1 : 0}; visibility:${shown ? 'visible' : 'hidden'}; pointer-events:${shown ? 'auto' : 'none'}">
        <p class="sq-text"><span>${slide.title}</span> <span class="sq-desc">${slide.description}</span></p>
        <a class="sq-action" href="${slide.href}" tabindex="${shown ? 0 : -1}">${slide.action}
          <svg width="6" height="9" viewBox="0 0 6 9" fill="none"><path d="M1.2 1 4.7 4.5 1.2 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>`;
  }).join('');

  // Bind events
  strip.querySelectorAll('.sq-panel').forEach(btn => {
    btn.addEventListener('mousemove', () => { hover = +btn.dataset.col; rerenderWidths(); });
    btn.addEventListener('click', () => { const c = +btn.dataset.col; if (c > 0) step(c); });
  });
}

function rerenderWidths() {
  const strip = document.getElementById('strip');
  strip.querySelectorAll('.sq-panel').forEach((btn, place) => {
    const col = place + column;
    btn.style.width = widthOf(col);
    btn.style.borderRadius = `min(var(--sq-radius), calc(${widthOf(col)} / 2))`;
  });
}

function settle() {
  cards = forward ? cards.slice(-visible) : cards.slice(0, visible);
  column = 0; slid = 0; still = true;
  render();
  requestAnimationFrame(() => { still = false; });
}

function step(by) {
  if (slides.length < 2 || by === 0) return;
  forward = by > 0;
  if (by > 0) {
    const last = cards[cards.length - 1].slide;
    for (let k = 0; k < by; k++) cards.push({ key: seed++, slide: wrap(last + 1 + k) });
    column -= by; slid -= by;
  } else {
    const first = cards[0].slide;
    for (let k = 0; k < -by; k++) cards.unshift({ key: seed++, slide: wrap(first - (-by - k)) });
    slid += by; still = true;
    render();
    setTimeout(() => { slid = 0; }, 0);
  }
  render();
  setTimeout(settle, 1020);
}

document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
});

document.getElementById('carousel').addEventListener('mouseleave', () => { hover = -1; rerenderWidths(); });

render();
</script>

</body>
</html>
